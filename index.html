<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML-Games</title>
<style>
  :root { --bg:#1a1f2b; --panel:#232a3a; --text:#e8ecf4; --dim:#93a0b8; --accent:#ffd54a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; padding:40px 16px; background:var(--bg); color:var(--text);
    font-family:"Segoe UI","Yu Gothic UI","Noto Sans JP",sans-serif; }
  main { max-width:560px; margin:0 auto; }
  h1 { margin:0 0 6px; font-size:28px; letter-spacing:2px; }
  p.lead { margin:0 0 28px; color:var(--dim); font-size:14px; }
  a.card { display:block; background:var(--panel); border:1px solid #3a4661; border-radius:12px;
    padding:18px 20px; margin-bottom:14px; color:var(--text); text-decoration:none; }
  a.card:hover, a.card:focus-visible { border-color:var(--accent); outline:none; }
  .name { font-size:20px; font-weight:600; }
  .desc { margin-top:4px; font-size:13px; color:var(--dim); }
  footer { margin-top:30px; font-size:12px; color:var(--dim); }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<main>
  <h1>HTML-Games</h1>
  <p class="lead">ブラウザだけで遊べる1ファイル完結のゲーム集。スマホ対応。</p>
  <a class="card" href="reversi.html">
    <div class="name">リバーシ</div>
    <div class="desc">CPU対戦（4段階）/ 2人プレイ ・ タッチ・キーボード・ゲームパッド対応</div>
  </a>
  <a class="card" href="shogi.html">
    <div class="name">将棋</div>
    <div class="desc">CPU対戦 / 2人プレイ ・ 二歩・打ち歩詰め・千日手・入玉宣言に対応 ・ タッチ・キーボード・ゲームパッド対応</div>
  </a>
  <footer>MIT License © 2026 Masahiro Miyazaki ・ <a href="https://github.com/MasahiroMiyazaki/HTML-Games">GitHub</a></footer>
</main>
</body>
</html>
